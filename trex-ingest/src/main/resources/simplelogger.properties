# slf4j-simple configuration for this service.
# System properties win over this file, so any setting can be overridden at run time,
# e.g. -Dorg.slf4j.simpleLogger.defaultLogLevel=debug
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd'T'HH:mm:ss.SSSXXX
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.showThreadName=false
# Logs go to stderr so that stdout stays clean for CLI output (the ING adapter's
# per-row results are a documented contract, README "ING adapter").
org.slf4j.simpleLogger.logFile=System.err
