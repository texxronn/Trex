<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>trex · resolver</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark">trex</span>
      <span class="divider">/</span>
      <span class="product">web</span>
    </div>
    <div class="segmented" role="tablist" aria-label="View">
      <a class="tablink" href="/" role="tab" title="Browse the journal">Transactions</a>
      <button type="button" role="tab" aria-selected="true">Resolve</button>
    </div>
    <div class="status" id="status" title="Journal follower status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">connecting…</span>
    </div>
  </header>

  <main class="content">
    <section class="panel" aria-labelledby="review-title">
      <div class="panel-head">
        <h2 id="review-title">Review</h2>
        <span class="count" id="review-count">0</span>
        <span class="hint">ambiguous matches and potential duplicates</span>
      </div>
      <div class="table-wrap">
        <table class="grid">
          <thead>
            <tr>
              <th class="col-sel"></th>
              <th class="col-date">Date</th>
              <th class="col-acct">Account</th>
              <th class="col-amt">Amount</th>
              <th class="col-desc">Description</th>
              <th class="col-badge">Status</th>
              <th class="col-n">n</th>
              <th class="col-act"></th>
            </tr>
          </thead>
          <tbody id="review-body"></tbody>
        </table>
        <p class="empty" id="review-empty">Nothing to review.</p>
      </div>
    </section>

    <section class="panel" aria-labelledby="held-title">
      <div class="panel-head">
        <h2 id="held-title">Held</h2>
        <span class="count" id="held-count">0</span>
        <span class="hint">transfer-shaped, waiting for the other leg</span>
      </div>
      <div class="table-wrap">
        <table class="grid">
          <thead>
            <tr>
              <th class="col-sel"></th>
              <th class="col-date">Date</th>
              <th class="col-acct">Account</th>
              <th class="col-amt">Amount</th>
              <th class="col-desc">Description</th>
              <th class="col-badge">Status</th>
              <th class="col-n">n</th>
              <th class="col-act"></th>
            </tr>
          </thead>
          <tbody id="held-body"></tbody>
        </table>
        <p class="empty" id="held-empty">No held transactions.</p>
      </div>
    </section>
  </main>

  <div class="pairbar" id="pairbar" hidden>
    <span class="pair-text" id="pair-text"></span>
    <button type="button" class="btn ghost" id="pair-clear">Clear</button>
    <button type="button" class="btn primary" id="pair-btn" disabled>Pair as transfer</button>
  </div>

  <dialog class="confirm" id="confirm">
    <form method="dialog" id="confirm-form">
      <h3 id="confirm-title"></h3>
      <div class="confirm-body" id="confirm-body"></div>
      <label class="field" id="confirm-comment-field">
        <span>Comment <em>optional</em></span>
        <textarea id="confirm-comment" rows="2" maxlength="500"></textarea>
      </label>
      <div class="confirm-actions">
        <button type="submit" value="cancel" class="btn ghost">Cancel</button>
        <button type="submit" value="ok" class="btn primary" id="confirm-ok">Confirm</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
