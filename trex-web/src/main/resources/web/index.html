<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>trex · grid</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark">trex</span>
      <span class="divider">/</span>
      <span class="product">web</span>
    </div>
    <div class="segmented" role="tablist" aria-label="View">
      <button type="button" data-view="transactions" role="tab">Transactions</button>
      <button type="button" data-view="journal" role="tab">Journal</button>
      <a class="tablink" href="/categorize" role="tab" title="Uncategorised merchants, and the rules for them">Categorize</a>
      <a class="tablink" href="/resolve" role="tab" title="HELD and REVIEW worklist">Resolve</a>
    </div>
    <div class="status" id="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">connecting…</span>
    </div>
  </header>

  <div class="toolbar">
    <input type="search" id="f-q" placeholder="Search description, comment, id, receipt…" autocomplete="off">
    <select id="f-account" title="Account"><option value="">All accounts</option></select>
    <select id="f-state" title="State">
      <option value="">All states</option>
      <option>HELD</option><option>MATCHED</option><option>REVIEW</option><option>EXTERNAL</option>
    </select>
    <select id="f-type" title="Type">
      <option value="">All types</option>
      <option>WITHDRAWAL</option><option>DEPOSIT</option><option>TRANSFER</option>
    </select>
    <input type="search" id="f-category" list="categories" placeholder="Category" title="Category (UNCATEGORIZED lists what needs a rule)" autocomplete="off" size="14">
    <datalist id="categories"></datalist>
    <label class="date" title="From date"><span>from</span><input type="date" id="f-from"></label>
    <label class="date" title="To date"><span>to</span><input type="date" id="f-to"></label>
    <button type="button" class="btn ghost" id="f-clear">Clear</button>
    <span class="spacer"></span>
    <button type="button" class="chip" id="new-chip" hidden></button>
    <label class="toggle" title="Follow new rows (page 1, sorted by n descending)">
      <input type="checkbox" id="follow"> Follow
    </label>
    <div class="columns">
      <button type="button" class="btn ghost" id="columns-btn" aria-expanded="false">Columns</button>
      <div class="popover" id="columns-pop" hidden></div>
    </div>
  </div>

  <main class="table-wrap">
    <table class="grid" id="grid">
      <thead><tr id="grid-head"></tr></thead>
      <tbody id="grid-body"></tbody>
    </table>
    <p class="empty" id="grid-empty" hidden>No rows match.</p>
  </main>

  <footer class="footer">
    <div class="totals" id="totals"></div>
    <div class="pager">
      <select id="page-size" title="Rows per page">
        <option>25</option><option selected>50</option><option>100</option><option>250</option>
      </select>
      <span class="range" id="range"></span>
      <button type="button" class="btn" id="prev" aria-label="Previous page">‹</button>
      <input type="number" id="page" min="1" value="1" aria-label="Page">
      <span class="of" id="of"></span>
      <button type="button" class="btn" id="next" aria-label="Next page">›</button>
    </div>
  </footer>
</body>
</html>
