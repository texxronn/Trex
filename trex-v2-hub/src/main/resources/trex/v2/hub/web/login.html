<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · trex</title>
<!--
  The sign-in page is self-contained on purpose (V2-SPEC.md §9.5, V2-AUTH-PLAN.md §4.4): it is
  reachable anonymously, so it must carry its own inline CSS and JS and depend on nothing under
  /ui/, which is gated.
-->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #12161c; color: #e6e9ee; }
  main { width: min(360px, 90vw); padding: 28px; border-radius: 12px; background: #1b212a;
         box-shadow: 0 10px 40px rgba(0, 0, 0, .4); }
  h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: .5px; }
  p.sub { margin: 0 0 20px; color: #9aa4b2; font-size: 13px; }
  label { display: block; margin: 12px 0 4px; font-size: 13px; color: #9aa4b2; }
  input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #2c3542;
          background: #0f1318; color: inherit; font-size: 15px; }
  input:focus { outline: 2px solid #3b82f6; outline-offset: 1px; }
  button { width: 100%; margin-top: 18px; padding: 11px; border: 0; border-radius: 8px;
           background: #3b82f6; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  .error { margin-top: 14px; color: #f87171; font-size: 13px; min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <h1>trex</h1>
  <p class="sub">Sign in to continue.</p>
  <form id="signin">
    <label for="user">User</label>
    <input id="user" name="user" autocapitalize="none" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button id="go" type="submit">Sign in</button>
    <div class="error" id="error" role="alert"></div>
  </form>
</main>
<script>
  // Only a same-origin absolute path is honoured: `next` comes from the request, so accepting a
  // scheme or a protocol-relative value would turn the gate into an open redirect.
  const requested = new URLSearchParams(location.search).get('next') || '/';
  const target = requested.startsWith('/') && !requested.startsWith('//') ? requested : '/';

  const form = document.getElementById('signin');
  const error = document.getElementById('error');
  const go = document.getElementById('go');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    error.textContent = '';
    go.disabled = true;
    try {
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: form.user.value, password: form.password.value }),
      });
      if (response.ok) {
        location.replace(target);
        return;
      }
      error.textContent = response.status === 401 ? 'Wrong user or password.' : 'Sign-in failed.';
    } catch (e) {
      error.textContent = 'The hub is unreachable.';
    } finally {
      go.disabled = false;
    }
  });
</script>
</body>
</html>
