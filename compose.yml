# trex — local and integration execution.
#
#   deploy/bin/trex-docker.sh build    # build the six images from Maven (jib)
#   docker compose up -d
#   docker compose run --rm ingress \
#     --source-type ing-csv --account ing-savings --sequencer-url http://sequencer:8080 /data/statement.csv
#   docker compose down                # add -v to discard the journal
#
# Everything here works against a remote Docker daemon too (see the README): images
# are built by jib, config is delivered as compose `configs` (content is sent to the
# daemon, not bind-mounted), and all state lives in named volumes. The one exception
# is the `ingress` service, which needs a host path to read a CSV from.
#
# No authentication anywhere: every published port binds to 127.0.0.1 on the Docker
# host. Do not change that without putting an authenticating proxy in front.

name: trex

x-hardening: &hardening
  # Parity with the systemd units (NoNewPrivileges, ProtectSystem=strict,
  # PrivateDevices, RestrictNamespaces): no capabilities, no privilege escalation,
  # and an immutable container filesystem. All real writes go to the volumes, which
  # are mounted separately and stay writable. /tmp is a tmpfs because the JVM wants
  # a writable java.io.tmpdir (hsperfdata, and sqlite-jdbc unpacks its native
  # library there).
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]

x-service: &service
  restart: unless-stopped
  environment:
    # Runtime JVM tuning; the images carry only -XX:+UseSerialGC.
    JAVA_TOOL_OPTIONS: ${TREX_JAVA_OPTS:--Xms64m -Xmx512m}
  depends_on:
    init:
      condition: service_completed_successfully
    sequencer:
      condition: service_healthy

configs:
  sequencer.yaml:
    # Container variant: binds 0.0.0.0, journal under /var/lib/trex.
    file: ./deploy/compose/sequencer.yaml
  accounts.yaml:
    file: ./deploy/config/accounts.yaml
  transfers.yaml:
    file: ./deploy/config/transfers.yaml
  # Read by the resolver and the grid, never by the sequencer: a category is derived,
  # not journalled (SPEC.md §0.7).
  categories.yaml:
    file: ./deploy/config/categories.yaml

volumes:
  journal:
  archive:
  sqlite:

services:
  # Named volumes are created root-owned; the services run as uid 1000. One short
  # root container fixes the ownership once, then exits. It reuses a trex image so
  # nothing extra is pulled.
  init:
    <<: *hardening
    # chown on a root-owned volume needs CAP_CHOWN back; nothing else.
    cap_drop: [ALL]
    cap_add: [CHOWN]
    image: ${TREX_IMAGE_PREFIX:-trex}/sequencer:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    user: root
    entrypoint: ["/bin/sh", "-c", "chown 1000:1000 /var/lib/trex/journal /var/lib/trex/archive /var/lib/trex/sqlite"]
    volumes:
      - journal:/var/lib/trex/journal
      - archive:/var/lib/trex/archive
      - sqlite:/var/lib/trex/sqlite
    restart: "no"

  # The single journal writer. Every other service mounts the journal read-only.
  sequencer:
    <<: *hardening
    image: ${TREX_IMAGE_PREFIX:-trex}/sequencer:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    command: ["/etc/trex"]
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: ${TREX_JAVA_OPTS:--Xms64m -Xmx512m}
    configs:
      - source: sequencer.yaml
        target: /etc/trex/sequencer.yaml
      - source: accounts.yaml
        target: /etc/trex/accounts.yaml
      - source: transfers.yaml
        target: /etc/trex/transfers.yaml
    volumes:
      - journal:/var/lib/trex/journal
    ports:
      - "127.0.0.1:${TREX_SEQ_PORT:-8080}:8080"
    # No curl in the base image; bash opens the socket instead.
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    # Leave time for an in-flight fsync, as TimeoutStopSec=30 does under systemd.
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully

  egress-archive:
    <<: [*service, *hardening]
    image: ${TREX_IMAGE_PREFIX:-trex}/egress-archive:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    command:
      - --journal
      - /var/lib/trex/journal/journal.jsonl
      - --archive
      - /var/lib/trex/archive/archive.jsonl
      - --poll-seconds
      - ${TREX_POLL_SECONDS:-60}
    volumes:
      - journal:/var/lib/trex/journal:ro
      - archive:/var/lib/trex/archive

  egress-sqlite:
    <<: [*service, *hardening]
    image: ${TREX_IMAGE_PREFIX:-trex}/egress-sqlite:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    # sqlite-jdbc unpacks a native .so at startup and dlopen()s it, so this one
    # service needs an executable tmpdir. The default tmpfs is noexec; the other
    # five services keep it that way.
    tmpfs: ["/tmp:exec"]
    command:
      - --journal
      - /var/lib/trex/journal/journal.jsonl
      - --db
      - /var/lib/trex/sqlite/trex.db
      - --poll-seconds
      - ${TREX_POLL_SECONDS:-60}
    volumes:
      - journal:/var/lib/trex/journal:ro
      - sqlite:/var/lib/trex/sqlite

  resolver:
    <<: [*service, *hardening]
    image: ${TREX_IMAGE_PREFIX:-trex}/resolver:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    command:
      - --journal
      - /var/lib/trex/journal/journal.jsonl
      - --sequencer-url
      - http://sequencer:8080
      - --categories
      - /etc/trex/categories.yaml
      - --bind
      - 0.0.0.0
      - --port
      - "8090"
    configs:
      - source: categories.yaml
        target: /etc/trex/categories.yaml
    volumes:
      - journal:/var/lib/trex/journal:ro
    ports:
      - "127.0.0.1:${TREX_RESOLVER_PORT:-8090}:8090"

  grid:
    <<: [*service, *hardening]
    image: ${TREX_IMAGE_PREFIX:-trex}/grid:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    command:
      - --journal
      - /var/lib/trex/journal/journal.jsonl
      - --categories
      - /etc/trex/categories.yaml
      - --bind
      - 0.0.0.0
      - --port
      - "8091"
    configs:
      - source: categories.yaml
        target: /etc/trex/categories.yaml
    volumes:
      - journal:/var/lib/trex/journal:ro
    ports:
      - "127.0.0.1:${TREX_GRID_PORT:-8091}:8091"

  # One-shot CSV import, not a daemon — hence the profile, so `up` ignores it:
  #   docker compose run --rm ingress \
  #     --source-type ing-csv --account ing-savings --sequencer-url http://sequencer:8080 /data/statement.csv
  # `run` replaces the command, so --sequencer-url is passed every time rather than baked in.
  # TREX_CSV_DIR is a path on the Docker *host*, so with a remote daemon it must be
  # a directory on that host.
  ingress:
    <<: *hardening
    image: ${TREX_IMAGE_PREFIX:-trex}/ingress:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    profiles: ["tools"]
    volumes:
      - ${TREX_CSV_DIR:-./}:/data:ro
