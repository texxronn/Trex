# Local Docker deployment of the four runnable modules. The egress image is reused
# with a different subcommand for each follower.
name: trex

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]

x-follower: &follower
  restart: unless-stopped
  environment:
    JAVA_TOOL_OPTIONS: ${TREX_JAVA_OPTS:--Xms64m -Xmx512m}
  depends_on:
    init:
      condition: service_completed_successfully
    sequencer:
      condition: service_healthy

configs:
  sequencer.yaml:
    file: ./deploy/compose/sequencer.yaml
  accounts.yaml:
    file: ./deploy/config/accounts.yaml
  transfers.yaml:
    file: ./deploy/config/transfers.yaml
  categories.yaml:
    file: ./deploy/config/categories.yaml
  pins.yaml:
    file: ./deploy/config/pins.yaml

volumes:
  journal:
  archive:
  sqlite:
  config:

services:
  # Seed a writable, persistent config volume and set ownership for uid 1000.
  # Existing rule files are kept on restart so UI edits survive container rebuilds.
  init:
    <<: *hardening
    image: ${TREX_IMAGE_PREFIX:-trex}/sequencer:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    user: root
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      mkdir -p /etc/trex /var/lib/trex/journal /var/lib/trex/archive /var/lib/trex/sqlite;
      for f in sequencer.yaml accounts.yaml transfers.yaml categories.yaml pins.yaml; do
        if [ ! -e "/etc/trex/$$f" ]; then cp "/bootstrap/$$f" "/etc/trex/$$f"; fi;
      done;
      chown -R 1000:1000 /etc/trex /var/lib/trex
    cap_drop: [ALL]
    # DAC_OVERRIDE is needed to seed files into fresh root-owned volume roots;
    # CHOWN then hands the populated volumes to the service uid.
    cap_add: [CHOWN, DAC_OVERRIDE]
    configs:
      - source: sequencer.yaml
        target: /bootstrap/sequencer.yaml
      - source: accounts.yaml
        target: /bootstrap/accounts.yaml
      - source: transfers.yaml
        target: /bootstrap/transfers.yaml
      - source: categories.yaml
        target: /bootstrap/categories.yaml
      - source: pins.yaml
        target: /bootstrap/pins.yaml
    volumes:
      - config:/etc/trex
      - journal:/var/lib/trex/journal
      - archive:/var/lib/trex/archive
      - sqlite:/var/lib/trex/sqlite
    restart: "no"

  # The only journal writer. Config is shared read-only with it; trex-ws
  # owns writes to categories.yaml and pins.yaml.
  sequencer:
    <<: *hardening
    image: ${TREX_IMAGE_PREFIX:-trex}/sequencer:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    command: ["/etc/trex"]
    environment:
      JAVA_TOOL_OPTIONS: ${TREX_JAVA_OPTS:--Xms64m -Xmx512m}
    volumes:
      - config:/etc/trex:ro
      - journal:/var/lib/trex/journal
    ports:
      - "127.0.0.1:${TREX_SEQ_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully

  egress-archive:
    <<: [*follower, *hardening]
    image: ${TREX_IMAGE_PREFIX:-trex}/egress:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    command:
      - archive
      - --journal
      - /var/lib/trex/journal/journal.jsonl
      - --archive
      - /var/lib/trex/archive/archive.jsonl
      - --poll-seconds
      - ${TREX_POLL_SECONDS:-60}
    volumes:
      - journal:/var/lib/trex/journal:ro
      - archive:/var/lib/trex/archive

  egress-sqlite:
    <<: [*follower, *hardening]
    image: ${TREX_IMAGE_PREFIX:-trex}/egress:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    tmpfs: ["/tmp:exec"]
    command:
      - sqlite
      - --journal
      - /var/lib/trex/journal/journal.jsonl
      - --db
      - /var/lib/trex/sqlite/trex.db
      - --poll-seconds
      - ${TREX_POLL_SECONDS:-60}
    volumes:
      - journal:/var/lib/trex/journal:ro
      - sqlite:/var/lib/trex/sqlite

  # Host networking lets the host reach the admin listener, which is deliberately
  # bound to 127.0.0.1 inside the service. The read listener stays loopback by
  # default; TREX_WS_BIND can expose only its read-only routes on another interface.
  ws:
    <<: [*follower, *hardening]
    image: ${TREX_IMAGE_PREFIX:-trex}/ws:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    network_mode: host
    command:
      - --journal
      - /var/lib/trex/journal/journal.jsonl
      - --sequencer-url
      - http://127.0.0.1:${TREX_SEQ_PORT:-8080}
      - --config
      - /etc/trex
      - --bind
      - ${TREX_WS_BIND:-127.0.0.1}
      - --port
      - ${TREX_WS_PORT:-8090}
      - --admin-port
      - ${TREX_ADMIN_PORT:-8085}
    volumes:
      - config:/etc/trex
      - journal:/var/lib/trex/journal:ro

  # One-shot statement import. Replace the command on each `compose run`.
  ingest:
    <<: *hardening
    image: ${TREX_IMAGE_PREFIX:-trex}/ingest:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    profiles: ["tools"]
    volumes:
      - ${TREX_CSV_DIR:-./}:/data:ro
