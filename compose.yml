# trex — local and integration execution.
#
#   deploy/bin/trex-docker.sh build    # build the six images from Maven (jib)
#   docker compose up -d
#   docker compose run --rm ingress \
#     --account ing-savings --url http://sequencer:8080 /data/statement.csv
#   docker compose down                # add -v to discard the journal
#
# Everything here works against a remote Docker daemon too (see the README): images
# are built by jib, config is delivered as compose `configs` (content is sent to the
# daemon, not bind-mounted), and all state lives in named volumes. The one exception
# is the `ingress` service, which needs a host path to read a CSV from.
#
# No authentication anywhere: every published port binds to 127.0.0.1 on the Docker
# host. Do not change that without putting an authenticating proxy in front.

name: trex

x-service: &service
  restart: unless-stopped
  environment:
    # Runtime JVM tuning; the images carry only -XX:+UseSerialGC.
    JAVA_TOOL_OPTIONS: ${TREX_JAVA_OPTS:--Xms64m -Xmx512m}
  depends_on:
    init:
      condition: service_completed_successfully
    sequencer:
      condition: service_healthy

configs:
  sequencer.toml:
    # Container variant: binds 0.0.0.0, journal under /var/lib/trex.
    file: ./deploy/compose/sequencer.toml
  accounts.toml:
    file: ./deploy/config/accounts.toml
  transfers.toml:
    file: ./deploy/config/transfers.toml

volumes:
  journal:
  archive:
  sqlite:

services:
  # Named volumes are created root-owned; the services run as uid 1000. One short
  # root container fixes the ownership once, then exits. It reuses a trex image so
  # nothing extra is pulled.
  init:
    image: ${TREX_IMAGE_PREFIX:-trex}/sequencer:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    user: root
    entrypoint: ["/bin/sh", "-c", "chown 1000:1000 /var/lib/trex/journal /var/lib/trex/archive /var/lib/trex/sqlite"]
    volumes:
      - journal:/var/lib/trex/journal
      - archive:/var/lib/trex/archive
      - sqlite:/var/lib/trex/sqlite
    restart: "no"

  # The single journal writer. Every other service mounts the journal read-only.
  sequencer:
    image: ${TREX_IMAGE_PREFIX:-trex}/sequencer:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    command: ["/etc/trex"]
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: ${TREX_JAVA_OPTS:--Xms64m -Xmx512m}
    configs:
      - source: sequencer.toml
        target: /etc/trex/sequencer.toml
      - source: accounts.toml
        target: /etc/trex/accounts.toml
      - source: transfers.toml
        target: /etc/trex/transfers.toml
    volumes:
      - journal:/var/lib/trex/journal
    ports:
      - "127.0.0.1:${TREX_SEQ_PORT:-8080}:8080"
    # No curl in the base image; bash opens the socket instead.
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    # Leave time for an in-flight fsync, as TimeoutStopSec=30 does under systemd.
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully

  egress-archive:
    <<: *service
    image: ${TREX_IMAGE_PREFIX:-trex}/egress-archive:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    command:
      - --journal
      - /var/lib/trex/journal/journal.jsonl
      - --archive
      - /var/lib/trex/archive/archive.jsonl
      - --poll-seconds
      - ${TREX_POLL_SECONDS:-60}
    volumes:
      - journal:/var/lib/trex/journal:ro
      - archive:/var/lib/trex/archive

  egress-sqlite:
    <<: *service
    image: ${TREX_IMAGE_PREFIX:-trex}/egress-sqlite:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    command:
      - --journal
      - /var/lib/trex/journal/journal.jsonl
      - --db
      - /var/lib/trex/sqlite/trex.db
      - --poll-seconds
      - ${TREX_POLL_SECONDS:-60}
    volumes:
      - journal:/var/lib/trex/journal:ro
      - sqlite:/var/lib/trex/sqlite

  resolver:
    <<: *service
    image: ${TREX_IMAGE_PREFIX:-trex}/resolver:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    command:
      - --journal
      - /var/lib/trex/journal/journal.jsonl
      - --sequencer-url
      - http://sequencer:8080
      - --bind
      - 0.0.0.0
      - --port
      - "8090"
    volumes:
      - journal:/var/lib/trex/journal:ro
    ports:
      - "127.0.0.1:${TREX_RESOLVER_PORT:-8090}:8090"

  grid:
    <<: *service
    image: ${TREX_IMAGE_PREFIX:-trex}/grid:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    command:
      - --journal
      - /var/lib/trex/journal/journal.jsonl
      - --bind
      - 0.0.0.0
      - --port
      - "8091"
    volumes:
      - journal:/var/lib/trex/journal:ro
    ports:
      - "127.0.0.1:${TREX_GRID_PORT:-8091}:8091"

  # One-shot CSV import, not a daemon — hence the profile, so `up` ignores it:
  #   docker compose run --rm ingress \
  #     --account ing-savings --url http://sequencer:8080 /data/statement.csv
  # `run` replaces the command, so --url is passed every time rather than baked in.
  # TREX_CSV_DIR is a path on the Docker *host*, so with a remote daemon it must be
  # a directory on that host.
  ingress:
    image: ${TREX_IMAGE_PREFIX:-trex}/ingress-ing:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    profiles: ["tools"]
    volumes:
      - ${TREX_CSV_DIR:-./}:/data:ro
