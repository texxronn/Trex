# trex v2 — the container deployment (V2-PROPOSAL.md §14: "Deployment is one image").
#
#   mvn -pl trex-v2-dist -am package -Pdocker        # builds trex/trex-v2:<version>
#   docker compose -f deploy/v2/compose.yml up -d    # sequencer + hub
#   docker compose -f deploy/v2/compose.yml run --rm --profile tools ingest --types
#   docker compose -f deploy/v2/compose.yml run --rm --profile tools egress firefly --plan ...
#
# Every service runs the same image; only the command names the role. The tuned rules in
# deploy/config are seeded into a writable volume (the hub's rule editor still writes
# categories.yaml), so nothing is baked into the image.
name: trex-v2

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  # exec, not the default: sqlite-jdbc extracts a native library into /tmp and loads it, so a
  # noexec /tmp makes the hub (and the index/verify tools) fail at startup. v1's sqlite egress
  # needed the same.
  tmpfs: ["/tmp:exec"]

x-trex: &trex
  image: ${TREX_IMAGE_PREFIX:-trex}/trex-v2:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
  user: "1000:1000"
  environment:
    JAVA_TOOL_OPTIONS: ${TREX_JAVA_OPTS:--Xms64m -Xmx512m}
    # The instance label: stamped into every log line's envelope and shown in the hub header, so a
    # Dev screen can never be mistaken for Prod. At most 8 characters; set it in .env per stack.
    TREX_ENV: ${TREX_ENV:-Dev1}

configs:
  sequencer.yaml:
    file: ./sequencer.yaml
  accounts.yaml:
    file: ../config/accounts.yaml
  users.yaml:
    file: ../config/users.yaml
  categories.yaml:
    file: ../config/categories.yaml
  transfers.yaml:
    file: ../config/transfers.yaml
  pins.yaml:
    file: ../config/pins.yaml
  firefly.yaml:
    file: ../config/firefly.yaml
  ezb.yaml:
    file: ../config/ezb.yaml
  cashflow.yaml:
    file: ../config/cashflow.yaml
  statements.yaml:
    file: ../config/statements.yaml
  sources.yaml:
    file: ../config/sources.yaml
  schedule.yaml:
    file: ../config/schedule.yaml
  profiles.yaml:
    file: ../config/profiles.yaml
  mortgages.yaml:
    file: ../config/mortgages.yaml

volumes:
  config:
  journal:
  index:
  evidence:
  archive:
  staging:

services:
  # Seed a writable config volume and the state directories, then hand them to uid 1000.
  # Existing rule files are kept (a UI edit survives a container rebuild): init never overwrites
  # /etc/trex/<file>. It does refresh /etc/trex/.shipped/<file> with the image's copy on every up,
  # and records /etc/trex/.base/<file> when it installs a missing file — the hub's config-drift
  # read (V2-QOL-IMPROVEMENTS-PLAN.md §3) compares the three.
  init:
    <<: *hardening
    image: ${TREX_IMAGE_PREFIX:-trex}/trex-v2:${TREX_IMAGE_TAG:-0.1.0-SNAPSHOT}
    user: root
    entrypoint: ["/bin/sh", "-ec"]
    # A list of one, on purpose: Compose shell-splits a string command, so `sh -ec` would
    # receive only the first word as its script. One list item keeps the whole script an
    # argument. The missing-file check, not cp -n, because the same copy records the base.
    command:
      - >-
        mkdir -p /etc/trex /etc/trex/.shipped /etc/trex/.base /var/lib/trex/journal /var/lib/trex/index /var/lib/trex/evidence /var/lib/trex/archive /var/lib/trex/staging;
        for f in sequencer.yaml accounts.yaml users.yaml categories.yaml transfers.yaml pins.yaml firefly.yaml ezb.yaml cashflow.yaml statements.yaml sources.yaml schedule.yaml profiles.yaml mortgages.yaml; do
          cp "/bootstrap/$$f" "/etc/trex/.shipped/$$f";
          if [ ! -e "/etc/trex/$$f" ]; then
            cp "/bootstrap/$$f" "/etc/trex/$$f";
            cp "/bootstrap/$$f" "/etc/trex/.base/$$f";
          fi;
        done;
        chown -R 1000:1000 /etc/trex /var/lib/trex/journal /var/lib/trex/index /var/lib/trex/evidence /var/lib/trex/archive /var/lib/trex/staging
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    configs:
      - { source: sequencer.yaml, target: /bootstrap/sequencer.yaml }
      - { source: accounts.yaml, target: /bootstrap/accounts.yaml }
      - { source: users.yaml, target: /bootstrap/users.yaml }
      - { source: categories.yaml, target: /bootstrap/categories.yaml }
      - { source: transfers.yaml, target: /bootstrap/transfers.yaml }
      - { source: pins.yaml, target: /bootstrap/pins.yaml }
      - { source: firefly.yaml, target: /bootstrap/firefly.yaml }
      - { source: ezb.yaml, target: /bootstrap/ezb.yaml }
      - { source: cashflow.yaml, target: /bootstrap/cashflow.yaml }
      - { source: statements.yaml, target: /bootstrap/statements.yaml }
      - { source: sources.yaml, target: /bootstrap/sources.yaml }
      - { source: schedule.yaml, target: /bootstrap/schedule.yaml }
      - { source: profiles.yaml, target: /bootstrap/profiles.yaml }
      - { source: mortgages.yaml, target: /bootstrap/mortgages.yaml }
    volumes:
      - config:/etc/trex
      - journal:/var/lib/trex/journal
      - index:/var/lib/trex/index
      - evidence:/var/lib/trex/evidence
      - archive:/var/lib/trex/archive
      - staging:/var/lib/trex/staging
    restart: "no"

  # The only journal writer. It reads config read-only: it never edits the rules.
  sequencer:
    <<: [*trex, *hardening]
    command:
      - sequencer
      - --journal
      - /var/lib/trex/journal/trex.jsonl
      - --config
      - /etc/trex
      - --archive
      - /var/lib/trex/archive
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    volumes:
      - config:/etc/trex:ro
      - journal:/var/lib/trex/journal
      - archive:/var/lib/trex/archive
    ports:
      - "${TREX_SEQ_BIND:-127.0.0.1}:${TREX_SEQ_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 30s
    depends_on:
      init:
        condition: service_completed_successfully

  # Owns the index and the blotter UI, and forwards decisions to the sequencer.
  hub:
    <<: [*trex, *hardening]
    command:
      - hub
      - --journal
      - /var/lib/trex/journal/trex.jsonl
      - --config
      - /etc/trex
      - --index
      - /var/lib/trex/index/trex.sqlite
      - --host
      - 0.0.0.0
      - --port
      - "8090"
      - --sequencer-url
      - http://sequencer:8080
      - --evidence
      - /var/lib/trex/evidence
      - --runner-url
      - http://runner:8091
    environment:
      JAVA_TOOL_OPTIONS: ${TREX_JAVA_OPTS:--Xms64m -Xmx512m}
      # Repeated, not inherited: a service's own environment block replaces the x-trex one, and
      # the hub reads TREX_ENV for its header badge — without this line Prod would show DEV1.
      TREX_ENV: ${TREX_ENV:-Dev1}
      TREX_RUNNER_TOKEN: ${TREX_RUNNER_TOKEN:-}
      # Sign-in (V2-SPEC.md §9.5). Unset = the hub is open, exactly as before (A-7). Point it at the
      # credential file created by `trex hub passwd` (docs/DEPLOYMENTS.md) to require a signed-in ron
      # or mel; a missing or malformed file is a startup error, never a silent "open".
      TREX_AUTH_FILE: ${TREX_AUTH_FILE:-}
    volumes:
      - config:/etc/trex
      - journal:/var/lib/trex/journal:ro
      - index:/var/lib/trex/index
      - evidence:/var/lib/trex/evidence
      # The credential file lives outside the repo and outside the config volume, and is never
      # seeded, synced or drift-checked (V2-SPEC.md §12).
      - ${TREX_AUTH_DIR:-/opt/trex/auth}:/etc/trex-auth:ro
    ports:
      # Loopback by default. Set TREX_HUB_BIND=0.0.0.0 (or a LAN IP) to put the UI on the network.
      # Sign-in is opt-in (TREX_AUTH_FILE above); without it the API is open to anyone who can reach
      # the port, and `/mcp` is never gated either (V2-SPEC.md §9.5) — front it with Caddy, TLS or a
      # tunnel before exposing it.
      - "${TREX_HUB_BIND:-127.0.0.1}:${TREX_HUB_PORT:-8090}:8090"
    depends_on:
      init:
        condition: service_completed_successfully
      sequencer:
        condition: service_healthy

  # The on-demand job dispatcher and staging inbox (V2-PROPOSAL.md §5.5, §12.5). It binds the
  # container's network so the hub can proxy it, but the port is NEVER published — reachable only
  # inside the compose network. Jobs are the same subcommands a person would run; the runner never
  # writes the log and never touches the index.
  runner:
    <<: [*trex, *hardening]
    command:
      - runner
      - --host
      - 0.0.0.0
      - --port
      - "8091"
      - --config
      - /etc/trex
      - --statements
      - /statements
      - --staging
      - /var/lib/trex/staging
      - --evidence
      - /var/lib/trex/evidence
      - --archive
      - /var/lib/trex/archive
      - --sequencer-url
      - http://sequencer:8080
      - --hub-url
      - http://hub:8090
      - --firefly-url
      - ${TREX_FIREFLY_URL:?set TREX_FIREFLY_URL}
      - --accounts
      - /etc/trex/firefly.yaml
      - --ezb-url
      - ${TREX_EZB_URL:?set TREX_EZB_URL}
      - --ezb-accounts
      - /etc/trex/ezb.yaml
      - --journal
      - /var/lib/trex/journal/trex.jsonl
    environment:
      JAVA_TOOL_OPTIONS: ${TREX_JAVA_OPTS:--Xms64m -Xmx512m}
      FIREFLY_TOKEN: ${FIREFLY_TOKEN:-}
      EZB_TOKEN: ${EZB_TOKEN:-}
      # The fast one-call clear (V2-SPEC.md §11.2); absent -> the view clears by id, no password.
      EZB_USER: ${EZB_USER:-}
      EZB_PASSWORD: ${EZB_PASSWORD:-}
      TREX_RUNNER_TOKEN: ${TREX_RUNNER_TOKEN:-}
    volumes:
      - config:/etc/trex:ro
      - journal:/var/lib/trex/journal:ro
      - staging:/var/lib/trex/staging
      - ${TREX_CSV_DIR:-./}:/statements:ro
      - evidence:/var/lib/trex/evidence
      - archive:/var/lib/trex/archive
    depends_on:
      init:
        condition: service_completed_successfully
      sequencer:
        condition: service_healthy
      hub:
        condition: service_started

  # ---- on-demand tools (profile "tools") --------------------------------------------------

  index:
    <<: [*trex, *hardening]
    profiles: ["tools"]
    command:
      - index
      - --journal
      - /var/lib/trex/journal/trex.jsonl
      - --config
      - /etc/trex
      - --index
      - /var/lib/trex/index/trex.sqlite
      - --rebuild
    volumes:
      - config:/etc/trex:ro
      - journal:/var/lib/trex/journal:ro
      - index:/var/lib/trex/index

  verify:
    <<: [*trex, *hardening]
    profiles: ["tools"]
    command:
      - verify
      - --journal
      - /var/lib/trex/journal/trex.jsonl
      - --config
      - /etc/trex
      - --index
      - /var/lib/trex/index/trex.sqlite
      - --evidence
      - /var/lib/trex/evidence
    volumes:
      - config:/etc/trex:ro
      - journal:/var/lib/trex/journal:ro
      - index:/var/lib/trex/index
      - evidence:/var/lib/trex/evidence

  ingest:
    <<: [*trex, *hardening]
    profiles: ["tools"]
    command: ["ingest", "--types"]
    volumes:
      - ${TREX_CSV_DIR:-./}:/data:ro
      - config:/etc/trex:ro
      - journal:/var/lib/trex/journal:ro
      - evidence:/var/lib/trex/evidence
    depends_on:
      sequencer:
        condition: service_healthy

  egress-archive:
    <<: [*trex, *hardening]
    profiles: ["tools"]
    command:
      - egress
      - archive
      - --journal
      - /var/lib/trex/journal/trex.jsonl
      - --archive
      - /var/lib/trex/archive/archive.jsonl
      - --evidence
      - /var/lib/trex/evidence
      - --evidence-archive
      - /var/lib/trex/archive/evidence
    volumes:
      - journal:/var/lib/trex/journal:ro
      - evidence:/var/lib/trex/evidence:ro
      - archive:/var/lib/trex/archive

  egress-firefly:
    <<: [*trex, *hardening]
    profiles: ["tools"]
    command:
      - egress
      - firefly
      - --hub-url
      - http://hub:8090
      - --firefly-url
      - ${TREX_FIREFLY_URL:?set TREX_FIREFLY_URL}
      - --accounts
      - /etc/trex/firefly.yaml
      - --plan
    volumes:
      - config:/etc/trex:ro
    depends_on:
      init:
        condition: service_completed_successfully
      hub:
        condition: service_started

  # The live view (V2-SPEC.md §11.2). EZB_TOKEN is the API token; --plan writes nothing.
  egress-ezb:
    <<: [*trex, *hardening]
    profiles: ["tools"]
    command:
      - egress
      - ezb
      - --hub-url
      - http://hub:8090
      - --ezb-url
      - ${TREX_EZB_URL:?set TREX_EZB_URL}
      - --accounts
      - /etc/trex/ezb.yaml
      - --plan
    environment:
      EZB_TOKEN: ${EZB_TOKEN:-}
      EZB_USER: ${EZB_USER:-}
      EZB_PASSWORD: ${EZB_PASSWORD:-}
    volumes:
      - config:/etc/trex:ro
    depends_on:
      init:
        condition: service_completed_successfully
      hub:
        condition: service_started
