# Master categories — SPEC.md §5.6, §6.
#
# Read by journal consumers only (grid, resolver, and later the Firefly egress);
# the sequencer never loads this file. A category is NEVER stored in the journal:
# change a rule here and every matching transaction, including old ones, is
# recategorised with no journal line written (invariant §0.7).
#
# Fine-grained categorisation stays in Firefly. This is the master level only.
#
# Reserved, and never declared or assigned here:
#   TRANSFER        a transfer line or one of its legs — comes from the journal
#   UNCATEGORIZED   nothing matched; the worklist that tells you what rule to write next
#
# Declared but deliberately rule-less:
#   BIG_TICKET_PURCHASES   a hand-PINned label for large one-offs (a vehicle purchase, a mattress).
#                          Size is not a kind: a size rule would fight the purpose categories, so
#                          the operator assigns this one deliberately, row by row.
#   HOBBY                  hobby supplies, gear and projects — its own bucket, distinct from
#                          DISCRETIONARY (eating out, shows) and SHOPPING (general retail). A
#                          merchant rule would claim every Spotlight/Anaconda buy alike, and hobby
#                          is judged per purchase, so it is hand-PINned too.
#   CELEBRATIONS           birthday parties, communions, christenings and family functions —
#                          judged per event (venue, catering, décor, entertainment), so a merchant
#                          rule would misfire and it is hand-PINned like BIG_TICKET_PURCHASES.
#                          A present bought for the occasion is GIFTS_GIVEN; a church offering is
#                          CHARITY.
#   LEGAL                  government and legal fees judged per instance — a passport at the post
#                          office, a conveyancer, a filing fee — so it is hand-PINned.
#   PERSONAL_CARE          hair, barbers, nails, beauty and the spa — judged per visit, and the
#                          fragments collide with other descriptors ("Splash's Pools" contains
#                          "lash", "Auto Spares" contains "spa", "Oliver Brown" contains "brow"),
#                          so a merchant rule misfires; hand-PINned like the others.
#
# Rule shape (first match wins, pins before rules):
#   category: <declared name>
#   when:
#     all / any / not      compose, nest freely
#     externalId: [ids]    exact ids — the pin form
#     match: "regex"       case-insensitive, matched anywhere in the text
#     matchOn: raw         raw (default, verbatim from the bank) or description (cleaned)
#     direction: in|out    from the sign of the amount
#     accounts: [refs]     either side of a transfer counts
#     amountMin/amountMax  inclusive cents, against the absolute amount
#
# Refunds. A merchant-identity rule (one whose `match` is a merchant or provider name) is
# deliberately direction-blind, so a refund lands in the category it reverses and the month
# nets out. Direction is kept only where the word alone does not identify the money: SALARY
# and INTEREST_EARNED require `in`, INTEREST_PAID/FEES/VISA_FEES require `out`, and a cash
# withdrawal is never a deposit. Direction-blind rules may match an inbound description that
# happens to name a merchant; measured, that is almost always the refund it is.

categories: [BIG_TICKET_PURCHASES, BILLS, BONUS, CASH_WITHDRAW, CELEBRATIONS, CHARITY, CHILDCARE,
             DISCRETIONARY, FEES, FLIGHTS, FOOD, FUEL, GIFTS_GIVEN, GROCERIES, HEALTH,
             HEALTH_SUPPLIES, HOBBY, HOME_IMPROVEMENT, HOUSE_WORKS, INSURANCE, INTEREST_EARNED,
             INTEREST_PAID, INVESTMENTS, LEGAL, PERSONAL_CARE, PROFESSIONAL_DEVELOPMENT, REBATES,
             SALARY, SAVINGS, SCHOOL_FEES, SHOPPING, SPORT_AND_LEISURE, SUBSCRIPTIONS, TAXES,
             TRANSPORT, TRAVEL, VEHICLE, VISA_FEES]

# One-off corrections live in pins.yaml (§6): same mechanism, different owner — this file is
# hand-written and ordered, that one is written by trex-ws and order-independent.

# Order is the decision: first match wins. The narrow rules come first, so a line naming
# both a specific merchant and a generic word lands where it belongs.
rules:
  - category: SALARY
    comment: "pay coming in — salary, payroll or wages, either earner"
    when:
      all:
        - direction: in
        - match: "salary|payroll|wages?"

  # The employer's payroll bank credits the pay as "UBS AG 67313 - … From 062000 …"; the word
  # salary never appears. Direction stays in: the one outbound "Funding for UBS re - Interactive
  # Brokers" line is an investment transfer, not pay.
  - category: SALARY
    comment: "the payroll run, credited from UBS AG — the remitter's name, not the word salary"
    when:
      all:
        - direction: in
        - match: "\\bubs ag\\b"

  # A bonus, not a salary: the employer's referral and incentive disbursements, written by the
  # admin arm ("J.P. Morgan Admi INVREF-…") rather than the payroll descriptor ("JPMAS PAYROLL …")
  # the SALARY rules match. Blind like a merchant-identity rule, so a referral clawback nets
  # against the bonus it reverses instead of sitting in UNCATEGORIZED.
  - category: BONUS
    comment: "employer bonuses and referral incentives, by the admin arm's descriptor"
    when:
      match: "j\\.p\\. morgan admi"

  # Interest EARNED (direction in) as against INTEREST_PAID below.
  - category: INTEREST_EARNED
    comment: "interest and dividends credited to an account"
    when:
      all:
        - direction: in
        - match: "interest|dividend"

  # Interest you PAY: credit-card purchase interest, loan interest charges, excess-interest
  # debits. Before BILLS, because a loan interest line names the mortgage and BILLS matches
  # "mortgage". Matching the bare word with direction out covers every form the banks write:
  #   "PURCHASE INTEREST" · "Interest Charge - Receipt No …" · "Interest charge – Revolving"
  #   (note the en dash) · "Debit Excess Interest"
  - category: INTEREST_PAID
    comment: "interest you pay: card purchase interest, loan and excess-interest charges"
    when:
      all:
        - direction: out
        - match: "interest"

  # Money given back by a bank or provider: refinance cashbacks and similar rebates. Blind, so a
  # clawback nets against the rebate it reverses. The FX-fee rebates stay FEES — there they net the
  # fee that caused them, which is the point of that rule (international transaction fee).
  - category: REBATES
    comment: "cashbacks and rebates from a bank or provider"
    when:
      all:
        - match: "cashback|rebate"
        - not:
            match: "international transaction fee"

  # School fees first, so a school's "fees" is never read as a bank charge. The school and the
  # after-school care share a name but are different money — "COM*HolyFamilyCathol" against
  # "Direct Debit … Holy Family OOSH" — so this sits above FEES and above CHILDCARE.
  - category: SCHOOL_FEES
    comment: "school fees and school-billed extras"
    when:
      match: "holyfamilycatho|school fees|tuition"

  - category: "SCHOOL_FEES"
    comment: "schools, university and student accommodation, plus book club and assessments"
    when:
      match: "scholastic|st patricks college|wccs\\.nsw\\.edu|icas assessments|unsw|scape|tafestore"

  # The kids' piano teacher, paid by CommBank App — tuition, so it sits with SCHOOL_FEES. The memo
  # varies — "Piano Lessons", "11 Lessons", "Payment", or nothing — so match the payee name, the
  # one constant.
  - category: SCHOOL_FEES
    comment: "the kids' private piano lessons (tuition), billed by the teacher"
    when:
      match: "vazhel"

  # Adult professional exams and credentials — Pearson VUE test centres and similar. Kept apart
  # from SCHOOL_FEES (the kids' schooling); the descriptor is the payment gateway's, e.g.
  # "WL *VUE* TESTING EXAM    BLOOMINGTON  MN".
  - category: PROFESSIONAL_DEVELOPMENT
    comment: "professional certification and licensing exams"
    when:
      match: "pearson|vue\\*|testing exam"

  # International transaction fees and their rebates. Blind on purpose: the rebate is the fee
  # reversed and must net against it — the FEES rule below is direction-out and so would never see
  # the 54 rebates (they sat uncategorised until this rule existed).
  - category: FEES
    comment: "international transaction fees, blind so the rebate nets"
    when:
      match: "international transaction fee"

  # What the bank charges you: account keeping, safe custody, overdraw, late payment, dishonour.
  # \bfees?\b on purpose — "COFFEE" contains "fee" and would otherwise be a bank charge.
  # School fees are claimed above, so a school's "fees" never reaches here.
  # The `not` clause matters too: ING writes cash withdrawals with an "ATM owner fee of $0.00"
  # suffix, so the word appears on rows that are withdrawals, not fees.
  - category: FEES
    comment: "what the bank charges: account keeping, overdraw, late payment, dishonour"
    when:
      all:
        - direction: out
        - match: "\\bfees?\\b"
        - not:
            match: "atm owner fee"

  # Visa and immigration charges. NEVER the bare word "visa": every ING card row says
  # "Visa Purchase", so that would swallow the entire credit-card statement.
  - category: VISA_FEES
    comment: "visa and immigration charges, never the word on a card row"
    when:
      all:
        - direction: out
        - match: "statebankin|vfsglobal|home affairs|immi account"

  # Cash out of an ATM. FEES runs above but excludes the "ATM owner fee of $0.00" suffix ING
  # writes on these rows, so a withdrawal that mentions a fee is not read as one. Honest at
  # master level: once it is cash, the statement cannot say what it bought.
  - category: CASH_WITHDRAW
    comment: "cash out of an ATM — at master level the statement cannot say what it bought"
    when:
      all:
        - direction: out
        - match: "\\batm\\b|wdl atm|cash out|cash withdrawal"

  # Insurance premiums, by provider name; some providers never write the word. Blind, so a
  # premium refund nets here.
  - category: INSURANCE
    comment: "insurance premiums, by provider name"
    when:
      match: "insurance|\\bnib\\b|nrma|medibank|bupa|ahm|allianz|aami|youi|budget direct"

  # Recurring services. Before SHOPPING, so AMAZON WEB SERVICES is hosting rather than retail.
  - category: SUBSCRIPTIONS
    comment: "recurring services billed monthly or yearly"
    when:
      match: "netflix|stan\\b|spotify|disney|binge|kayo|prime video|anthropic|claude|openai|amazon web services|apple\\.com|google (one|storage)|youtubepremium|microsoft|backblaze|namecheap|humblebundl|truthfinder"

  # Getting around without driving: Opal (trains and buses, the primary mode here), tolls,
  # rideshare trips, and the airline/ferry booking sites that are transport rather than travel.
  # "UBER *TRIP" only — Uber Eats is food; the banks pad the field, so allow any spacing.
  # Tolls sit here rather than with FUEL because they are a cost of the trip, not of the car.
  - category: TRANSPORT
    comment: "trains, tolls, rideshare and tap-on transport"
    when:
      match: "tfnsw|opal machine|opal fare|linkt|e-?toll|uber\\s+\\*?\\s*trip|translink|transportfornsw|syd aprt intnl carp"

  # Petrol only, kept apart from TRANSPORT so train spend is visible on its own, and apart
  # from VEHICLE so servicing does not hide inside the fuel bill. Before GROCERIES so COSTCO
  # GAS is fuel while COSTCO WHOLESALE and COSTCO CROSSROADS stay the weekly shop.
  # \bshell\b, never bare "shell": SHELLHARBOUR is a suburb that appears in these statements.
  - category: FUEL
    comment: "petrol, kept apart from TRANSPORT because trains are the primary transport"
    when:
      match: "ampol|speedway|costco gas|mobil|caltex|\\bbp\\b|\\bshell\\b|7-eleven|united petroleum|metro petroleum|metro macquarie|puma energy|petrol|\\bfuel\\b|eg group|reddy express"

  # Keeping the car on the road: servicing, repairs, tyres, rego. Fuel stays separate. `mechanic`
  # not `mechanical`: the bank truncates long names ("J & D JENSEN MECHANICA"), and the local
  # mechanic is named directly so a truncated descriptor still lands here.
  - category: VEHICLE
    comment: "keeping the car on the road: rego, servicing, parts"
    when:
      match: "bluegum|autocare|auto care|mechanic|jensen|\\btyres?\\b|service centre|\\brego\\b|registration|smash repair"

  - category: GROCERIES
    comment: "supermarkets, grocers and the bulk shops"
    when:
      match: "woolworths|coles|aldi|iga|foodland|costco wholesale|costco crossroads|minto fruit|bakers flour|glenfield bakery|best meats"

  # Eating that is not a grocery run: cafés, coffee, takeaway. Restaurants are deliberately
  # NOT here — a restaurant meal is the thing you would cut, so it sits in DISCRETIONARY,
  # and Firefly can split café from restaurant downstream if the detail is ever wanted.
  - category: FOOD
    comment: "eating out: cafes, bakeries, takeaway and restaurants"
    when:
      match: "cafe|coffee|piccolo me|uber eats|menulog|doordash|gyg|guzman|little chinese kitchen|whale tea|cake merchant|dominos|gong cha|sushi hub|pline ph|sushi|mcdonald|hungry jack|kfc|krispy kreme|donut king|gloria jeans|oporto|yakiniku|doughkyo|dosahut|lotus express|michael chang|prince bakery|trappers bakery|market espresso|caffe brioso"

  # H Nguyen Rolls, a takeaway paid by Osko; the descriptor carries the payee name and a mobile
  # number, so the name is the only stable handle.
  - category: FOOD
    comment: "H Nguyen Rolls, via Osko"
    when:
      match: "h nguyen rolls"

  # The school canteen: Flexischools is a school-payments platform (it can also sell uniforms and
  # trips), but the family's charges are canteen top-ups, so they sit with FOOD — above CHILDCARE,
  # which no longer claims the name.
  - category: FOOD
    comment: "the school canteen (Flexischools)"
    when:
      match: "flexischool"

  # School fees, before CHILDCARE: the school and the after-school care share a name but are
  # different money. CCS is the Child Care Subsidy, paid to you and netting against the cost.
  - category: CHILDCARE
    comment: "childcare and after-school care, net of the CCS subsidy"
    when:
      match: "holy family|oosh|childcare|child care|\\bccs\\b|papilio|qp ?pel"

  # CarePlus Compounding, a compounding pharmacy. Kept in HEALTH (the service), not HEALTH_SUPPLIES,
  # and placed above it so a future "pharmacy" in the text cannot pull it the other way.
  - category: HEALTH
    comment: "CarePlus Compounding"
    when:
      match: "careplus"

  # Over the counter: pharmacy and the like.
  - category: HEALTH_SUPPLIES
    comment: "chemists and health supplies"
    when:
      match: "chemist|pharmacy|priceline|\\bcwh\\b"

  # Seeing someone: GP, dental, optical, physio, specialists. The negative lookahead keeps the
  # hospitality merchant ("SQ *KKSY HOSPITALITY") out without a word boundary, because the bank
  # glues hospital names ("LiverpoolHospital", "TheChildrensHospitalWe") where \b would fail.
  - category: HEALTH
    comment: "medical: doctors, dentists, specialists, health funds"
    when:
      match: "healthcare|medical|dental|physio|specsavers|optical|pathology|radiology|hospital(?!ity)"

  # Medicare benefits: the rebate the government pays back for a service — inbound cash that nets
  # against the health spend it partly refunds, because the visit is booked at full cost and the
  # benefit arrives separately. Blind, like the provider rules.
  - category: HEALTH
    comment: "Medicare benefits — the rebate that nets against health spend"
    when:
      match: "mcare|medicare"

  # Gyms, pools, leisure centres and the kids' sport clubs.
  - category: SPORT_AND_LEISURE
    comment: "sport, activities and the kids' clubs"
    when:
      match: "mount annan leisur|ymca|bluefit|campbelltown indoo|gunners soccer|gunners sc|eschol park|camden tigers|football|soccer club|leisure cent"

  # Aquarium supplies; a hobby the operator wanted apart from general retail.
  - category: HOBBY
    comment: "SUNREY AQUATICS"
    when:
      match: "sunrey aquatics"

  # Hardware and the house, tracked apart from general retail. Only the chain seen in the
  # data so far; adding another is a config edit, not a code change.
  - category: HOME_IMPROVEMENT
    comment: "hardware and the house — tracked apart from SHOPPING on purpose"
    when:
      match: "bunnings|mitre ?10"

  # Trades on the property: installations, repairs, servicing, refurbishment — the labour side, as
  # against HOME_IMPROVEMENT (the hardware you bought) and BILLS (running the house). Blind, so a
  # trade's refund nets here. Word-bounded on purpose: "Liverpool" is not a pool and "electricity"
  # is not an electrician.
  - category: HOUSE_WORKS
    comment: "trades on the property: solar, roof, plumbing, electrical, garage doors, landscaping, pest control"
    when:
      match: "solar|modern roof restoration|\\broof restor|\\bplumb|\\belectric(al|ian)\\b|sparky|garage door|\\bhandyman|\\bgutter|\\bfence|irrigation|paving|\\bturf|landscap|\\bpest\\b|enviro spray"

  # Pool service, parts and repairs; the refund claims here too (blind).
  - category: HOUSE_WORKS
    comment: "pool service, parts and repairs"
    when:
      match: "poolwerx|splash.{0,8}pool|\\bmf pool|\\bpool (service|repair|fix|clean)"

  # Gifts and giving: charities, appeals and crowdfunding. Before the op-shop SHOPPING rule, so
  # "SALVOS STORES ... Donation" reads as a donation while "SALVOS STORES" alone stays retail.
  - category: CHARITY
    comment: "gifts to charities, appeals and crowdfunding"
    when:
      match: "charity|donation|\\bappeal|gofundme|red cross|unicef|oxfam|world vision|\\brspca\\b|leukemia|cancer council|bushfire|\\buniting\\b"

  # Gifts you give: weddings, Christmas, coach collections. Out only — money collected from other
  # parents towards a gift is not a gift given and stays for review. \bpresent\b rather than bare
  # "present" so "represent" can never claim it. No birthday/bday: an occasion word is not a gift,
  # and "BIRTHDAY PARTY VENUE" belongs to CELEBRATIONS by hand.
  - category: GIFTS_GIVEN
    comment: "presents and gift money given"
    when:
      all:
        - direction: out
        - match: "\\bgift|wedding|christmas|xmas|anniversary|\\bpresent\\b"

  # A celebration cake: the same money as the party it is for, so not FOOD.
  - category: CELEBRATIONS
    comment: "CAKEMAKERS SYDNEY (celebration cakes)"
    when:
      match: "cakemakers"

  # Retail, including the op shops.
  - category: "SHOPPING"
    comment: "general retail that no narrower rule claimed. alipayaustr and aiaumarkets are the same company — AIAU Markets Pty Ltd trades as Alipay (Australia), ABN 17 151 757 845 — so both descriptors mean a payment processor, not a shop"
    when:
      match: "amazon au|amazon pay india|kmart|big ?w|target [0-9]|st vincent de paul|vinnies|salvos|myer|ikea|just ?group|ebay au|alipayaustr|aiaumarkets|hmhennesmau|kathmandupt|temu"

  - category: BILLS
    comment: "household bills: power, water, phone, internet, council"
    when:
      match: "electricity|water corp|sydney water|internet|mobile|rent|mortgage|subscription|agl sales|agl retail|telco payment|telstralimi|council|campbelltown city|campbelltown cncl|aussie broadband|cba safe custody"

  - category: TAXES
    comment: "tax paid to the ATO or to Revenue NSW"
    when:
      match: "\\bATO\\b|australian taxation|tax office"

  # Money into market investments: brokers, funds, micro-investing and superannuation. Moves
  # between your own accounts are structurally TRANSFER and never reach this rule. Direction stays
  # out — a contribution is the thing worth seeing; an inbound distribution or redemption is not a
  # contribution and stays for review (INTEREST_EARNED claims the ones that say interest/dividend).
  - category: INVESTMENTS
    comment: "money moved deliberately into the market: brokers, funds, super"
    when:
      all:
        - direction: out
        - match: "interactive ?brokers|vanguard|betashares|raiz|spaceship|superannuation|australiansuper|commsec|selfwealth|superhero|\\bstake\\b|swyftx|coinspot|coinbase|etoro"

  # Cash set aside outside the tracked accounts: term deposits and external savers. Own-account
  # moves are structurally TRANSFER and never reach this rule; nothing has matched here yet, so it
  # is the worklist to extend when an external saver appears.
  - category: SAVINGS
    comment: "cash set aside outside the tracked accounts (term deposits, external savers)"
    when:
      all:
        - direction: out
        - match: "term deposit|bonus saver|high interest savings"

  # Everyday discretionary spend: restaurants, pubs, clubs, cinemas, and the bottle shop.
  # Last, so every specific rule above wins first.
  - category: DISCRETIONARY
    comment: "the wants rather than the needs"
    when:
      match: "restaurant|bar |pub |cinema|bottle|rsl|diggers|catholic cl|liquorland|liquor"

  - category: "FOOD"
    comment: "takeaway, cafes, bakeries and restaurants"
    when:
      match: "domino|pizza|sushi people|food depot|scirocco|chatkazz|raj bhavan|breadtop|cheesecake shop"

  - category: "GROCERIES"
    comment: "Asian and Indian grocers, greengrocers and bakeries around Ingleburn/Strathfield — the weekly shop that is not a Coles or Woolworths"
    when:
      match: "udaya|nilgiris|longwei|hyper foods|supermart|super ?market|veggie & gr|ozmart|sai ram|spices|qianxi|sunrise gourmet|breadtop|bakers delight"

  - category: "SUBSCRIPTIONS"
    comment: "recurring memberships billed to a card: Prime, eBay Plus, Udemy, SEMrush"
    when:
      match: "udemy|amznprime|ebay plus|semrush|google zepp|prime ?au"

  - category: "VEHICLE"
    comment: "rego, fines and parts — Service NSW, the State Debt Recovery Office, Supercheap"
    when:
      match: "sdro|infrngmnt|super ?cheap|snsw|service nsw"

  - category: "TAXES"
    comment: "accountants and tax agents"
    when:
      match: "tax store|smart tax advisors"

  # Airfares on their own, so a trip's tickets are visible apart from the rest of it. Before
  # SPORT_AND_LEISURE, which used to own these merchants; QANTAS CONCOURSE is airport spend,
  # not a fare, and TRAVEL catches it.
  - category: "FLIGHTS"
    comment: "airfares: tickets and airline charges"
    when:
      match: "qantas ticket|qantas airways|jetstar|flyscoot|virgin australia|air new zealand|singapore air|emirates|qatar airways|airasia"

  # The rest of the trip: stays, holiday parks, cruises and travel retail. Blind, so a cancelled
  # booking refunds here.
  - category: "TRAVEL"
    comment: "stays, cruises and travel retail, apart from the airfare"
    when:
      match: "booking\\.?com|holiday park|breeze ap|club motel|moonshadow|duty free|qantas concourse"

  # Outings and junior sport: ticketing, zoos, theme parks and the kids' clubs. Airfares and
  # stays are FLIGHTS and TRAVEL now; the old "no TRAVEL category" note is superseded.
  - category: "SPORT_AND_LEISURE"
    comment: "outings and junior sport: ticketing, zoos, theme parks and clubs"
    when:
      match: "ticketek|ticketmaste|taronga|carnivalfun|feld entertainment|boatshed|rovers fc|soccajoey|minion"

  - category: "SHOPPING"
    comment: "general retail: electronics, clothing, stationery, department and online stores, and the sports and homeware chains"
    when:
      match: "jb hi.?fi|hn online|harvey norman|bevilles|strandbags|shein|lowes|portmans|hennes|best and less|goodguys|amazon reta|amazon mar|anaconda|surfside|reject shop|smiggle|officeworks|spotlight|tk ?maxx|rebel|h&m|temu"

  - category: "BILLS"
    comment: "energy and telco billed to a card, including via PayPal"
    when:
      match: "aglenergy|origin energy|telstra"

  - category: "HEALTH"
    comment: "NSW Health and local health district billing"
    when:
      match: "nswh |swslhd"
