# Transfer matching rules — SPEC.md §3.4, §6.
# A row is "transfer-shaped" when its raw description matches any allowlist regex
# (case-insensitive, Java regex syntax; single-quoted strings avoid escaping).
# Transfer-shaped rows without a matching contra leg are HELD for the resolver.

# Maximum days between the two legs of an amount/date (T3) match. Required.
#
# Raised from 3 to 4 before the history backfill. The number matters more than it
# looks: a leg that misses its partner is HELD, and the only repair is a manual
# CONFIRM_TRANSFER, which is a FINAL decision (SPEC §3.5). Re-ingesting does not
# retry — a re-delivered candidate with the same balance is dropped as a duplicate
# (§3.3 step 5), so each row attempts matching exactly once, at first ingest.
#
# Widening is the cheap direction. The matcher never guesses: more than one
# candidate in the window yields AmbiguousTransfer and a REVIEW item showing both
# sides (§3.4), so a wider window buys review items, not wrong matches — and a
# review where you pick between two candidates beats an orphan leg you have to
# hunt for.
#
# Evidence for the value: every transfer matched so far pairs at a gap of 0 days,
# but that is 30 internal transfers between accounts at the same bank. The case
# this has to cover is a BPAY card payment, where the paying bank and the card
# date the same movement differently — and there is exactly one of those matched
# today, so 0 is a sample, not a rule.
windowDays: 4

allowlist:
  - 'Internal Transfer'
  - 'To my account'
  - 'From my account'
  - 'Fast Transfer'
  # Internal CommBank transfers only — the account form, never a person's name.
  #
  # The broad form 'Transfer (to|from)' was wrong, and wrong in the expensive direction.
  # CommBank writes both of these, and only the first is an internal movement:
  #     "Transfer from xx2435 CommBank app house expenses"      <- own account
  #     "Transfer To Vazhel A John CommBank App Piano Lessons"  <- a payment to a person
  # Both matched, so the second was HELD waiting for a contra leg that can never exist.
  # Measured over 21 matching rows: 7 genuinely internal, 14 payments to people worth
  # $5,784 stuck forever — piano lessons, the tax agent, family.
  #
  # Those 14 are now ordinary expenses and can be categorised. Narrowing only affects
  # FUTURE ingests: matching happens once, at first ingest (§3.3 step 5), so rows already
  # HELD stay HELD and need decisions. Hence doing this before the history backfill.
  - 'Transfer (to|from) xx\d'
  - 'Osko'
  - 'PayID'
  # Credit-card payments from another of your own accounts. Transfer-shaped so they land in
  # HELD for review rather than reading as income: a card payment moves your own money, and
  # +$122k of it looked like an inflow before this line existed. The contra leg only pairs
  # once the paying account is ingested too.
  - 'Bill Payment Received'
  # The paying side of the same thing, as ING writes it: "BANKWEST CREDIT CARD 5229… - BPAY
  # Bill Payment - Receipt 52936 To BANKWEST CREDIT CARD 5229…". Deliberately the biller name
  # rather than 'BPAY Bill Payment', which would make every utility BPAY transfer-shaped and
  # leave it HELD forever waiting for a contra leg that does not exist.
  # These two legs pair on T3 (amount and date), never T1: ING gives its row a receipt and
  # BankWest has none, so there is no shared receipt to match on.
  - 'Bankwest Credit Card'
