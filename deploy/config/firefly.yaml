# Firefly III egress mapping — SPEC.md §5.8. Read by trex-egress-firefly and nothing else.
#
# This file exists so that Firefly's vocabulary stays out of the spine. accounts.yaml is the
# sequencer's registry; what a ref is *called in Firefly*, and whether Firefly considers it an
# asset or a liability, is the egress's business. A second egress gets its own file rather than
# another column in accounts.yaml.
#
# Keyed by NAME, not by Firefly's numeric id, on purpose:
#   - a Firefly rebuild changes every id and no name, so the mapping survives a restore
#   - the id is resolved at startup and cached; losing the cache costs one lookup
#   - a rename in Firefly is a hard stop at startup with the new name suggested, never a
#     silent post into the wrong account
#
# `type` must match what Firefly says, and startup refuses to run if it does not. It is not
# decoration: it decides the transaction type, because Firefly rejects a `transfer` that crosses
# between asset and liability (verified on 6.7.3).
#     asset <-> asset          transfer      (internal moves: a card or loan repayment, §11.1)
#     asset  -> liability      withdrawal    (into a legacy/clearing liability)
#     liability -> asset       deposit       (out of one)
#
# The ref is permanent (it is in the identity of receipt-keyed rows, §2.4). The name is a label
# and costs one line to change.

accounts:
  ing-savings:             { name: "ING Savings",           type: asset }
  ing-orange:              { name: "ING Orange Everyday",   type: asset }
  ing-salary:              { name: "ING Salary",            type: asset }
  ing-loan-offset:         { name: "ING Loan Offset",       type: asset }
  cba-smartaccess:         { name: "CBA SmartAccess",       type: asset }
  cba-netsaver:            { name: "CBA NetBank Saver",     type: asset }

  # Credit cards AND loans are Firefly *asset* accounts (Firefly's idiom, V2-SPEC.md §11.1): each
  # runs a negative balance, so a repayment is an asset <-> asset transfer and stays OUT of Firefly's
  # expense reports. A liability account would make every repayment a withdrawal, counting debt
  # repayment as spending. Only the loan *interest* (an EXTERNAL charge) is left as an expense.
  ing-credit-card:         { name: "ING Credit Card",       type: asset }
  bw-credit-card:          { name: "BankWest Credit Card",  type: asset }
  ing-mortgage-simplifier: { name: "ING Mortgage Simplifier", type: asset }
  ing-variable-rate:       { name: "ING Variable Rate Loan", type: asset }

  # The clearing accounts of V2-SPEC.md §6.7, plus cash. Which Firefly calls each an asset or a
  # liability is the egress's business (it decides the transaction type); the ref is permanent.
  westpac-card:   { name: "Westpac Card (closed)",         type: liability }
  nab-fixed:      { name: "NAB Fixed Loan (closed)",       type: liability }
  nab-variable:   { name: "NAB Variable Loan (closed)",    type: liability }
  nab-offset:     { name: "NAB Offset (closed)",           type: asset }
  carryover:      { name: "Carryover",                     type: asset }
  bw-card-legacy: { name: "BankWest Card (pre-2024)",      type: liability }
  cba-legacy:     { name: "CBA SmartAccess (pre-2024-10)", type: asset }
  cash-ron:       { name: "Cash (Ron)",                    type: asset }

  # Clearing accounts added to the journal after this file was first written. They clear the same
  # way as the block above; the name is the label Firefly shows, the type decides the transaction
  # direction (see the header). Each holds no facts and is never chained.
  # Westpac offset/loan package before the NAB and ING facilities; its residual was disbursed to
  # ing-variable-rate at the 2022-02 refinance (an ATTACH_ACCOUNT points the credit here).
  westpac-legacy:      { name: "Westpac Offset (closed)",  type: asset }
  # The NAB mortgage refinanced to ING on 2022-02-09; the two ING opening drawdowns are the payout.
  nab-mortgage-legacy: { name: "NAB Mortgage (closed)",     type: liability }
  # The old RAMS savings account, closed; its remaining balance moved to ing-orange on 2026-01-12.
  rams-savings:        { name: "RAMS Savings (closed)",     type: asset }
  # Kids' St George savings; the per-child landing is an ATTACH_ACCOUNT decision, not a pattern.
  sg-auriel:           { name: "St George (Auriel)",        type: asset }
  sg-blythe:           { name: "St George (Blythe)",        type: asset }
