# Account registry — SPEC.md §6. One entry per bank account.
#   ref              registry key used by trex-ingest (--account) and on every journal line
#   currency         AUD | USD | INR (stamped onto events; no conversion)
#   liquid           optional, default true: the account is household money the Cash flow sheet
#                    counts (V2-SPEC.md §9.2, V2-CASHFLOW-PLAN.md C-2). A move between two liquid
#                    accounts is noise; liquid -> loan is a repayment; liquid -> any other
#                    non-liquid account is set aside. A declared loan (mortgages.yaml) and a clearing
#                    account are never liquid, whatever the flag; kids' and investment accounts are
#                    liquid: false.
#                    The old 'budget' key is a config error.
# An unknown accountRef is always rejected; accounts are never auto-created.
#
# No Firefly fields here: how a ref maps to a Firefly account lives in firefly.yaml,
# which only the egress reads (SPEC.md §5.8).
#
# The ref is part of identity for receipt-keyed rows (nk|accountRef|receipt, §2.4), so
# renaming one re-mints every id in that account. Choose the name before the first ingest.
#
# Register BOTH sides of an internal transfer. ING gives the two legs the same receipt, so
# the T1 matcher pairs them automatically (§3.4) — but only if the contra account is also
# ingested; otherwise the leg sits HELD waiting for a leg that never arrives.
#
# chip_color   optional hub display colour for the account's chip (palette: slate, gray, stone,
#              zinc, red, rose, pink, fuchsia, purple, violet, indigo, blue, sky, cyan, teal,
#              emerald, green, lime, yellow, amber, orange). Presentation only — never identity or
#              logic; unset falls back to a deterministic colour, and the hub shows the same chip in
#              Blotter, Review, Eyeball, Accounts and Chains.
#
# fetchEveryDays  optional statement-age nudge (V2-QOL-IMPROVEMENTS-PLAN.md §2): the age of the account's
#              frontier — its newest statement row — beyond which the status strip says how many
#              statements to fetch. Presentation only; a read computes it, nothing is stored.
#              Default 31 for a statement account and none for declared/clearing; 0 turns the
#              nudge off (a closed account that still has statement rows).

accounts:
  - ref: "ing-savings"
    currency: "AUD"
    balanceSource: statement
    chip_color: blue
  # Orange Everyday.
  - ref: "ing-orange"
    currency: "AUD"
    balanceSource: statement
    chip_color: amber
  - ref: "ing-salary"
    currency: "AUD"
    balanceSource: statement
    chip_color: green

  # Credit card. A liability: purchases are debits, card payments are credits, and the
  # balance column is the amount owing — provenance only, never transaction semantics (§0.1).
  - ref: "ing-credit-card"
    currency: "AUD"
    balanceSource: statement
    chip_color: red

  # Loans. The offset is an asset; the two loan accounts are liabilities. A repayment is a
  # TRANSFER (offset → loan), not an expense: it moves money between accounts you own, so
  # booking it as spending would double-count it against the falling loan balance. The real
  # cost is the interest the loan account charges, which has no contra leg and stays EXTERNAL.
  # ING gives both legs of the repayment the same receipt, so T1 pairs them (§3.4) — which is
  # why all three must be registered, and why the loan side need not be transfer-shaped.
  - ref: "ing-loan-offset"
    currency: "AUD"
    balanceSource: statement
    chip_color: violet
  - ref: "ing-mortgage-simplifier"
    currency: "AUD"
    balanceSource: statement
    liquid: false        # a declared loan (mortgages.yaml): never liquid (C-2), explicit here
    chip_color: teal
    # Closed 2026-10-23: the fixed-rate balance rolled over onto ing-variable-rate. It keeps its
    # statement rows, so the nudge is turned off rather than deleting the account (the ref is
    # identity, §2.4). The final statement is unobtainable from ING, so the closing row is the open
    # item — until it lands the derived balance still reads −$327,921.77 (measured Dev1 2026-10-27).
    fetchEveryDays: 0
  - ref: "ing-variable-rate"
    currency: "AUD"
    balanceSource: statement
    liquid: false        # a declared loan (mortgages.yaml): never liquid (C-2), explicit here
    chip_color: fuchsia

  # BankWest credit card (bw-csv). Debits are positive in that export and no row carries a
  # receipt, so every transaction takes content-hash identity (§2.4) — which is why a day must
  # never be split across calls for this account (§4 day-atomic batching).
  - ref: "bw-credit-card"
    currency: "AUD"
    balanceSource: statement
    chip_color: orange

  # CommBank SmartAccess. The standard export is the Transaction Summary PDF (cba-pdf); no row
  # carries a receipt, so identity is the content hash (§2.4).
  - ref: "cba-smartaccess"
    currency: "AUD"
    balanceSource: statement
    chip_color: purple

  # NetBank Saver. CommBank exports no CSV for this one, which is why cba-pdf exists: its
  # Transaction Summary PDF is the only source the bank offers (§4).
  - ref: "cba-netsaver"
    currency: "AUD"
    balanceSource: statement
    chip_color: cyan

  # Clearing accounts (V2-PROPOSAL.md §6.10): a closed counterparty whose statements are gone.
  # They hold no facts and are never chained. Their opening is computed backwards from the
  # movements that matched them, so the derived balance lands on closingBalance. Retrofit is a
  # config edit: register the real account and drop the `clearing:` line.
  - ref: "westpac-card"
    currency: "AUD"
    balanceSource: clearing
    chip_color: stone
    closingBalance: 0
    closedAt: "2025-06-30"
  # The Westpac offset/loan package used before the NAB and ING facilities. Its residual was
  # disbursed to the new ING variable-rate loan at the 2022-02 refinance (WBC OLP EFT DISBUR);
  # an ATTACH_ACCOUNT points that credit here. Holds no facts; the computed opening absorbs it.
  - ref: "westpac-legacy"
    currency: "AUD"
    balanceSource: clearing
    chip_color: gray
    closingBalance: 0
    closedAt: "2022-02-10"
  - ref: "nab-fixed"
    currency: "AUD"
    balanceSource: clearing
    chip_color: slate
    closingBalance: 0
    closedAt: "2023-09-30"
  # The NAB variable-rate facility (retrofit of the mis-named 'nab-offset'; the 'Nab Offset'
  # payments in transfers.yaml land here).
  - ref: "nab-variable"
    currency: "AUD"
    balanceSource: clearing
    chip_color: zinc
    closingBalance: 0
    closedAt: "2023-02-28"

  # The real previous NAB offset account: the source of the large inbound Oskos in 2022, landed by
  # an ATTACH_ACCOUNT decision. Its closing is unknown, so the computed opening absorbs the position.
  - ref: "nab-offset"
    currency: "AUD"
    balanceSource: clearing
    chip_color: gray
    closingBalance: 0
    closedAt: "2023-02-28"

  # The NAB mortgage refinanced to ING on 2022-02-09. The new ING loans' opening drawdowns
  # (SWIFT Tfr, ing-mortgage-simplifier $360,000 and ing-variable-rate $159,402) are the payout;
  # an ATTACH_ACCOUNT decision points them here. Holds no facts and is never chained: the computed
  # opening absorbs the old facility, landing on the declared closing (0 — it was paid out in full).
  - ref: "nab-mortgage-legacy"
    currency: "AUD"
    balanceSource: clearing
    chip_color: gray
    closingBalance: 0
    closedAt: "2022-02-09"

  # The old RAMS savings account (13050368), closed. Its statements were never ingested; its
  # remaining balance came across to ing-orange on 2026-01-12, so the payout pairs directly with
  # this account. Closing 0: it emptied itself into the payout, and no movement is known after it.
  - ref: "rams-savings"
    currency: "AUD"
    balanceSource: clearing
    chip_color: rose
    closingBalance: 0
    closedAt: "2026-01-12"

  # The carryover book (§6.10): a holding account for genuinely one-sided movements — a transfer
  # whose contra cannot be identified, or a knowingly-unbalanced entry (hidden/cash) with no
  # statement. It holds no facts and is never chained; the derived opening absorbs the position.
  # Attribution is a decision (ATTACH_ACCOUNT), reversible when the real counterparty is found.
  - ref: "carryover"
    currency: "AUD"
    balanceSource: clearing
    chip_color: gray
    closingBalance: 0

  # Legacy clearing positions (V2-PROPOSAL.md §6.10): the counterparty *before* the statements we
  # hold, whose earlier history was pruned and is unobtainable. They hold no facts; the pre-coverage
  # transfers land here by an ATTACH_ACCOUNT decision, and the derived opening absorbs the
  # pre-history. Refresh the closing when a real statement for the period ever turns up.
  - ref: "bw-card-legacy"
    currency: "AUD"
    balanceSource: clearing
    chip_color: gray
    closingBalance: -626173    # the bw-credit-card balance at 2024-01-02, the handover point
    closedAt: "2024-01-01"
  - ref: "cba-legacy"
    currency: "AUD"
    balanceSource: clearing
    chip_color: gray
    closingBalance: 13554      # the cba-smartaccess balance at 2024-10-02
    closedAt: "2024-10-01"

  # The kids' savings accounts (St George), one per child. Their statements are not held, so a
  # clearing account: a transfer lands as an account side, never a fact, and the derived opening
  # absorbs the position. The destination text names their mother and the product ("maxi saver"),
  # never the child, so the per-child landing is an ATTACH_ACCOUNT decision, not a pattern
  # (see the 'maxi saver' entry in transfers.yaml). Migrate by registering the real account and
  # revoking the attach. A clearing account is never liquid, whatever the flag (C-2), so a
  # transfer into one is money set aside.
  - ref: "sg-auriel"
    currency: "AUD"
    balanceSource: clearing
    chip_color: pink
    closingBalance: 0
  - ref: "sg-blythe"
    currency: "AUD"
    balanceSource: clearing
    chip_color: fuchsia
    closingBalance: 0

  # Cash. balanceSource: declared — no statement exists, so balances arrive only when a person
  # states one (§2.3 ATTESTATION) and the chain has deliberate gaps between them. One per person,
  # because two wallets are two accounts however loosely either is tracked.
  - ref: "cash-ron"
    currency: "AUD"
    balanceSource: declared
    chip_color: lime

