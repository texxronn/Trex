# categories.tests.yaml — the golden set (V2-PROPOSAL.md §10.4, SPEC.md §5.6).
#
# description + amount (cents, signed) -> the category the rules must produce. Run on load and in
# CI: a rule regression fails the build, not a statement ingest. UNCATEGORIZED is a legitimate
# expected value, not a gap.
#
# The rules only, never pins: a pin is a decision and lives in the log, not in a fixture.
#
# Every rule in categories.yaml has at least one case, and the adversarial ones pin the subtleties
# the rules were tuned for: word boundaries (\bfees?\b vs COFFEE, \bshell\b vs SHELLHARBOUR,
# \brego\b vs GREGORY, \bATO\b vs GELATO), the excluded ATM owner fee, direction, and the
# orderings where two rules would both match (COSTCO GAS vs WHOLESALE, AMAZON WEB SERVICES vs
# AMAZON AU, UBER *TRIP vs UBER EATS, MORTGAGE INTEREST vs MORTGAGE REPAYMENT, INTEREST EARNED in
# vs out, BREADTOP in FOOD(2) before GROCERIES(2), UDAYA RESTAURANT in DISCRETIONARY before
# GROCERIES(2)). Descriptions are the raw bank text: match defaults to raw, verbatim.

tests:
  # --- SALARY (rule 1): in, salary/payroll/wages -------------------------------------------
  - description: "SALARY PAYROLL ACME PTY LTD"
    amount: 1000
    category: SALARY
  - description: "ACME PTY LTD WAGES WEEKLY"
    amount: 200000
    category: SALARY
  - description: "SALARY PAYROLL ACME PTY LTD"
    amount: -1000
    category: UNCATEGORIZED   # direction in; a salary-looking debit is not salary

  # --- INTEREST_EARNED (rule 2) / INTEREST_PAID (rule 3) -----------------------------------
  - description: "INTEREST EARNED"
    amount: 500
    category: INTEREST_EARNED
  - description: "DIVIDEND CBA 1234"
    amount: 700
    category: INTEREST_EARNED
  - description: "INTEREST EARNED"
    amount: -500
    category: INTEREST_PAID    # out, so the bare word is the paid side
  - description: "PURCHASE INTEREST - RECEIPT 123"
    amount: -500
    category: INTEREST_PAID
  - description: "DEBIT EXCESS INTEREST"
    amount: -300
    category: INTEREST_PAID
  - description: "Interest charge \u2013 Revolving"
    amount: -1200
    category: INTEREST_PAID    # the en-dash form the banks write
  - description: "MORTGAGE INTEREST CHARGE"
    amount: -90000
    category: INTEREST_PAID    # rule 3 wins before BILLS matches "mortgage"

