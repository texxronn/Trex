    category: FOOD              # "COFFEE" contains "fee"; \bfees?\b must not fire
  - description: "ATM OWNER FEE OF $0.00 WDL ATM"
    amount: -20000
    category: CASH_WITHDRAW    # the fee exclusion sends it to the withdrawal rule

