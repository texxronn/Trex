  PERSONAL_CARE: Living
  SPORT_AND_LEISURE: Living
  HOBBY: Living
  CELEBRATIONS: Living
  HOUSE_WORKS: Home
  HOME_IMPROVEMENT: Home
  FUEL: Transport
  TRANSPORT: Transport
  VEHICLE: Transport
  TRAVEL: Travel
  FLIGHTS: Travel
  HEALTH: Health
  HEALTH_SUPPLIES: Health
  CHILDCARE: Family
  SCHOOL_FEES: Family
  FEES: "Fees & tax"
  TAXES: "Fees & tax"
  VISA_FEES: "Fees & tax"
  LEGAL: "Fees & tax"
  INTEREST_PAID: "Fees & tax"
  PROFESSIONAL_DEVELOPMENT: Work
  SAVINGS: "Savings & investments"
  INVESTMENTS: "Savings & investments"
  CHARITY: Giving
  GIFTS_GIVEN: Giving
  BIG_TICKET_PURCHASES: One-offs
  CASH_WITHDRAW: One-offs
  UNCATEGORIZED: Unsorted
  UNDECIDED: Unsorted
accounts:
  ing-savings:             { name: "ING Savings",              category: 8 }
  ing-orange:              { name: "ING Orange Everyday",      category: 2 }
  ing-salary:              { name: "ING Salary",               category: 2 }
  ing-loan-offset:         { name: "ING Loan Offset",          category: 8 }
  cba-smartaccess:         { name: "CBA SmartAccess",          category: 2 }
  cba-netsaver:            { name: "CBA NetBank Saver",        category: 8 }
  ing-credit-card:         { name: "ING Credit Card",          category: 3 }
  bw-credit-card:          { name: "BankWest Credit Card",     category: 3 }
  ing-mortgage-simplifier: { name: "ING Mortgage Simplifier",  category: 5 }
  ing-variable-rate:       { name: "ING Variable Rate Loan",   category: 5 }
  westpac-card:            { name: "Westpac Card (closed)",    category: 5 }
  nab-fixed:               { name: "NAB Fixed Loan (closed)",  category: 5 }
  nab-variable:            { name: "NAB Variable Loan (closed)", category: 5 }
  nab-offset:              { name: "NAB Offset (closed)",      category: 8 }
