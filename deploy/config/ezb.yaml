# ezbookkeeping view mapping — V2-SPEC.md §11.2. Read by the ezb egress and nothing else.
#
# This file exists so that ezbookkeeping's vocabulary stays out of the spine. accounts.yaml is the
# sequencer's registry; what a ref is *called in ezbookkeeping*, and which ezbookkeeping account
# category it is, is the egress's business — a second egress gets its own file rather than another
# column in accounts.yaml.
#
# The view is disposably re-imported, never edited, so this file holds no ids: an ezbookkeeping
# rebuild is re-applied, not restored. It is therefore VIEW-ONLY and is never hashed into
# configRevision — it can move no derived state, only what the chart instance shows.
#
# Keyed by the permanent ref (it is in the identity of receipt-keyed rows, §4). The name is a label
# and costs one line to change.
#
# `category` is an ezbookkeeping ACCOUNT category, presentation only, never a trex category:
#     1 cash          2 checking     3 credit card   4 virtual   5 debt
#     6 receivables   7 investment   8 savings       9 CD
#
# `zone` is the IANA zone the view stamps onto every row: a unit date maps to 12:00 local, with the
# offset taken per date so DST cannot shift a day (§11.2).
#
# `categories` (optional) groups the EXPENSE secondaries under several primary categories, so the
# charts can aggregate by them: keyed by the trex master category, the value is the ezbookkeeping
# PRIMARY it sits under. An expense category with no entry falls back to `trex-expense`. It applies
# to the expense side only — income (category type 1) and transfer (type 3) keep their single
# `trex-income` / `trex-transfer` primary. View-only, like the rest of this file: never hashed into
# configRevision (§11.2).

zone: "Australia/Sydney"
categories:
  BILLS: "Bills & Subscriptions"
  SUBSCRIPTIONS: "Bills & Subscriptions"
  INSURANCE: "Bills & Subscriptions"
  GROCERIES: Living
  FOOD: Living
  DISCRETIONARY: Living
