# Dev transfer rules (SPEC.md §3.4, §6). Case-insensitive Java regex against
# rawDescription; single quotes so backslashes need no escaping.
#
# The dev samples are written against this list: the shared receipt on the two
# 'Fast Transfer' rows drives the T1 pair (a receipt alone does not make a leg
# transfer-shaped), 'Internal Transfer' drives the T3 pair, and 'Osko' is the
# unmatched leg that stays HELD for the resolver. Narrow the list to watch legs
# fall through to EXTERNAL instead.

windowDays = 3

allowlist = [
  'Internal Transfer',
  'To my account',
  'From my account',
  'Fast Transfer',
  'Transfer (to|from)',
  'Osko',
  'PayID',
]
